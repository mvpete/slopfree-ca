name: seed-content

# Manual: build a week of quiz content for the current golden and challenger, without a search.
# Used to start a trial from hand-picked seed prompts.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

      - name: Build the quiz content
        id: run
        run: node scripts/seed-content.js
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seed-results
          path: |
            content/
            evals/
          if-no-files-found: ignore

      - uses: actions/create-github-app-token@v1
        id: app
        with:
          app-id: ${{ vars.SLOPFREE_APP_ID }}
          private-key: ${{ secrets.SLOPFREE_APP_PRIVATE_KEY }}

      - uses: peter-evans/create-pull-request@v7
        id: pr
        with:
          token: ${{ steps.app.outputs.token }}
          branch: bot/seed-${{ github.run_id }}
          title: ${{ steps.run.outputs.title }}
          body-path: ${{ steps.run.outputs.body_path }}
          commit-message: ${{ steps.run.outputs.title }}
          add-paths: |
            content/
            evals/
          labels: bot

      - if: steps.pr.outputs.pull-request-number
        run: gh pr merge --auto --squash "${{ steps.pr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
