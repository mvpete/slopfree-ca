name: deploy-api

# Apply D1 migrations and deploy the scoring Worker.
# Skips until the CLOUDFLARE_API_TOKEN secret exists.
on:
  push:
    branches: [main]
    paths: ["api/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Cloudflare not set up yet
        if: env.HAS_CLOUDFLARE != 'true'
        run: echo "::notice::Skipping API deploy. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (see README, Setup)."

      - uses: actions/checkout@v4
        if: env.HAS_CLOUDFLARE == 'true'

      - name: Apply database migrations
        if: env.HAS_CLOUDFLARE == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: "4.158.0"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: api
          command: d1 migrations apply slopfree --remote

      - name: Deploy the Worker
        if: env.HAS_CLOUDFLARE == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: "4.158.0"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: api
          command: deploy
