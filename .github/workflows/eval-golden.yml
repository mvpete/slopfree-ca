name: eval-golden

# Manual check: does the current golden prompt pass the eval? Results show on the run page.
on:
  workflow_dispatch:
    inputs:
      articles:
        description: "Number of articles (3 is a cheap smoke test, 10 is the real check)"
        default: "3"

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the eval
        run: |
          set -o pipefail
          node scripts/eval-golden.js "${{ inputs.articles }}" | tee eval-output.txt
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Summary
        if: always()
        run: |
          { echo '```'; cat eval-output.txt 2>/dev/null || echo "No output"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the full report (summaries, points, numbers)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-golden-report
          path: evals/
          if-no-files-found: ignore
