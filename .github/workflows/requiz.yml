name: requiz

# Manual: rewrite the current quiz questions from the summaries readers see. Answers to the old
# questions stop counting (trial.json countFrom).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  requiz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

      - name: Rewrite the questions
        id: run
        run: node scripts/requiz.js
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: requiz-results
          path: |
            content/
            prompts/
          if-no-files-found: ignore

      - uses: actions/create-github-app-token@v1
        id: app
        with:
          app-id: ${{ vars.SLOPFREE_APP_ID }}
          private-key: ${{ secrets.SLOPFREE_APP_PRIVATE_KEY }}

      - uses: peter-evans/create-pull-request@v7
        id: pr
        with:
          token: ${{ steps.app.outputs.token }}
          branch: bot/requiz-${{ github.run_id }}
          title: ${{ steps.run.outputs.title }}
          commit-message: ${{ steps.run.outputs.title }}
          body: Each question is now about a fact that every prompt's summary states, checked by quotation. Answers to the old questions no longer count toward the trial.
          add-paths: |
            content/
            prompts/
          labels: bot

      - if: steps.pr.outputs.pull-request-number
        run: gh pr merge --auto --squash "${{ steps.pr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
