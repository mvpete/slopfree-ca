name = "slopfree-api"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Served at api.slopfree.ca (the domain is on Cloudflare). No workers.dev address.
workers_dev = false
routes = [{ pattern = "api.slopfree.ca", custom_domain = true }]

[vars]
ALLOWED_ORIGINS = "https://slopfree.ca,https://www.slopfree.ca,https://mvpete.github.io"
MODELS = "openai"
RATE_LIMIT_PER_HOUR = "30"

[[d1_databases]]
binding = "DB"
database_name = "slopfree"
database_id = "eb3e8cac-4bac-42d8-8f10-4c55eb356973"
migrations_dir = "migrations"

# Secrets (set with `npx wrangler secret put <NAME>`):
#   TURNSTILE_SECRET  Turnstile secret key; if unset, the bot check is skipped
#   EXPORT_TOKEN      bearer token for /v1/export (also the repo secret SLOPFREE_EXPORT_TOKEN)
#   RATE_SALT         random string; IPs are only ever stored as salted hourly hashes
